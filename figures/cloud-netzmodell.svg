<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 270" width="1140" height="270" role="img" aria-label="Cloud-Netzmodell: Internet über Floating IP und Router in ein Tenant-Netz mit Subnetz und VM; Security Group am Instanz-Port — mit den jeweiligen AWS-Entsprechungen">
  <defs>
    <style>
      .lbl   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #1a1a1a; }
      .lbl-b { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #003366; }
      .lbl-s { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .cap   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0066cc; }
      .site  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #003366; }
      .note  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #666666; }
      .aws   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #0066cc; }
      .box   { fill: #ffffff; stroke: #003366; stroke-width: 1.5; }
      .box-l { fill: #e8f0f8; stroke: #cfe0f2; stroke-width: 1; }
      .siteA { fill: #f7fbff; stroke: #cfe0f2; stroke-width: 1.2; }
      .flow  { stroke: #0066cc; stroke-width: 1.6; fill: none; }
      .nic   { fill: #0066cc; stroke: #003366; stroke-width: 0.7; }
      .sg    { fill: #fff8e1; stroke: #b8860b; stroke-width: 1.2; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0066cc"/>
    </marker>
  </defs>

  <!-- Internet / externes Netz -->
  <rect class="box" x="30" y="100" width="140" height="60" rx="6"/>
  <text class="lbl-b" x="100" y="126" text-anchor="middle">Internet</text>
  <text class="note" x="100" y="146" text-anchor="middle">externes Netz</text>

  <!-- Floating IP -->
  <rect class="box" x="230" y="105" width="150" height="50" rx="6"/>
  <text class="lbl-s" x="305" y="126" text-anchor="middle">Floating IP</text>
  <text class="note" x="305" y="144" text-anchor="middle">10.32.4.x</text>
  <text class="aws" x="305" y="176" text-anchor="middle">AWS: Elastic IP</text>

  <!-- Router / Gateway -->
  <rect class="box" x="440" y="95" width="140" height="70" rx="6"/>
  <text class="lbl-b" x="510" y="124" text-anchor="middle">Router</text>
  <text class="note" x="510" y="144" text-anchor="middle">Gateway nach außen</text>
  <text class="aws" x="510" y="186" text-anchor="middle">AWS: Internet Gateway</text>
  <text class="aws" x="510" y="202" text-anchor="middle">+ Route Table</text>

  <!-- Tenant-Netz (Cloud) -->
  <rect class="siteA" x="640" y="20" width="470" height="230" rx="8"/>
  <text class="site" x="656" y="44">Tenant-Netz (Cloud)</text>
  <text class="aws" x="656" y="62">AWS: VPC</text>

  <!-- Subnetz -->
  <rect class="box" x="660" y="80" width="200" height="56" rx="6"/>
  <text class="lbl-b" x="760" y="104" text-anchor="middle">Subnetz</text>
  <text class="note" x="760" y="124" text-anchor="middle">10.0.1.0/24</text>
  <text class="aws" x="760" y="154" text-anchor="middle">AWS: Subnet</text>

  <!-- Instanz mit Port -->
  <rect class="box" x="900" y="80" width="190" height="56" rx="6"/>
  <text class="lbl-b" x="995" y="104" text-anchor="middle">VM / Container</text>
  <text class="note" x="995" y="124" text-anchor="middle">lauscht auf Port 443</text>
  <rect class="nic" x="893" y="102" width="14" height="12" rx="2"/>
  <text class="aws" x="995" y="154" text-anchor="middle">AWS: EC2 / ECS</text>

  <!-- Security Group -->
  <rect class="sg" x="660" y="180" width="430" height="52" rx="6"/>
  <text class="lbl-s" x="875" y="203" text-anchor="middle">Security Group – erlaubt ein: 443 (HTTPS), 22 (SSH)</text>
  <text class="note" x="875" y="221" text-anchor="middle">alles andere ist zu — und wird geprüft, bevor Sie suchen</text>

  <!-- Fluss -->
  <path class="flow" d="M 170 130 L 224 130" marker-end="url(#a)"/>
  <path class="flow" d="M 380 130 L 434 130" marker-end="url(#a)"/>
  <path class="flow" d="M 580 130 L 654 108" marker-end="url(#a)"/>
  <path class="flow" d="M 860 108 L 894 108" marker-end="url(#a)"/>
</svg>
